<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLMS - Sách đang mượn</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/client.css">
</head>
<body class="client-body">
  <aside class="sidebar"></aside>
  <main class="main-wrapper">
    <div class="top-header">
      <div>
        <h1 class="page-title">Phiếu mượn của tôi</h1>
        <p class="page-subtitle">Gia hạn online nếu chưa quá hạn. Trả sách vẫn tại quầy.</p>
      </div>
      <button class="btn btn-secondary" onclick="loadLoans()">Làm mới</button>
    </div>
    <div class="panel">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Mã phiếu</th><th>Bản sao</th><th>Ngày mượn</th><th>Hạn trả</th><th>Trạng thái</th><th>Hành động</th>
            </tr>
          </thead>
          <tbody id="loans-body"><tr><td colspan="6" style="text-align:center;">Đang tải...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/client.js"></script>
  <script>
    const readerId = requireLogin();
    if (readerId) { renderClientSidebar("loans"); loadLoans(); }

    function statusBadge(status) {
      const s = (status || "").toUpperCase();
      if (s === "BORROWED") return `<span class="badge badge-warning">Đang mượn</span>`;
      if (s === "RETURNED") return `<span class="badge badge-success">Đã trả</span>`;
      if (s === "OVERDUE") return `<span class="badge badge-danger">Quá hạn</span>`;
      return `<span class="badge">${status || "-"}</span>`;
    }

    async function loadLoans() {
      const tbody = document.getElementById("loans-body");
      try {
        const loans = await fetchAPI("/api/loans?readerId=" + encodeURIComponent(readerId));
        if (!loans.length) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Chưa có phiếu mượn</td></tr>`;
          return;
        }
        tbody.innerHTML = loans.map(l => {
          const isOverdue = Date.parse((l.dueDate || "").replace(" ", "T")) < Date.now();
          const isBorrowed = (l.status || "").toUpperCase() === "BORROWED";
          const renewalCount = l.renewalCount || 0;
          const canRenew = isBorrowed && !isOverdue && renewalCount < 2;

          const renewalBadge = renewalCount > 0
            ? `<span class="badge badge-primary" style="font-size:10px;margin-left:4px;padding:2px 5px;" title="Đã gia hạn ${renewalCount} lần">+${renewalCount}</span>`
            : "";

          let actionContent = "-";
          if (isBorrowed) {
            if (canRenew) {
              actionContent = `<button class="btn btn-primary btn-sm" onclick="renewLoan('${l.loanId}', ${renewalCount})">Gia hạn (${renewalCount}/2)</button>`;
            } else if (isOverdue) {
              actionContent = `<span style="font-size:12px;color:var(--danger);font-weight:600;">Quá hạn</span>`;
            } else if (renewalCount >= 2) {
              actionContent = `<span style="font-size:12px;color:var(--text-muted);">Hết lượt (2/2)</span>`;
            }
          }

          return `<tr>
            <td><strong>${l.loanId}</strong></td><td>${l.copyId}</td>
            <td>${formatDateTime(l.borrowDate)}</td><td>${formatDateTime(l.dueDate)}${renewalBadge}</td>
            <td>${statusBadge(l.status)}</td>
            <td>${actionContent}</td>
          </tr>`;
        }).join("");
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);">Lỗi tải</td></tr>`;
      }
    }

    async function renewLoan(loanId, currentRenewalCount) {
      if (!confirm(`Xác nhận gia hạn phiếu mượn [${loanId}] (Lần ${(currentRenewalCount || 0) + 1}/2)?`)) return;
      try {
        const loan = await fetchAPI("/api/loans/renew", {
          method: "POST",
          body: JSON.stringify({ loanId })
        });
        alert(`🎉 Đã gia hạn thành công!\nHạn trả mới: ${formatDateTime(loan.dueDate)}\nSố lần đã gia hạn: ${loan.renewalCount}/2`);
        loadLoans();
      } catch (e) {}
    }
  </script>
</body>
</html>
