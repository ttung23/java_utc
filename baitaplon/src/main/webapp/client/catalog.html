<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLMS - Tra cứu sách</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/client.css">
</head>
<body class="client-body">
  <aside class="sidebar"></aside>
  <main class="main-wrapper">
    <div class="top-header">
      <div>
        <h1 class="page-title">Tra cứu sách</h1>
        <p class="page-subtitle">Xem số bản sao còn lại và đặt trước khi hết</p>
      </div>
    </div>
    <div class="panel" style="margin-bottom:20px;">
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="position:relative;flex:1;display:flex;align-items:center;">
          <input type="search" id="search-q" placeholder="Nhập tên sách..." style="width:100%;padding-right:34px;">
          <button id="clear-catalog-btn" class="clear-search-btn" type="button" onclick="clearCatalogSearch()" title="Xóa tìm kiếm (Xem tất cả)">✕</button>
        </div>
        <button class="btn btn-primary" onclick="loadCatalog()">Tìm kiếm</button>
      </div>
    </div>
    <div class="panel">
      <div class="table-responsive">
        <table>
          <thead><tr><th>ISBN</th><th>Tên sách</th><th>Tác giả</th><th>Còn lại</th><th></th></tr></thead>
          <tbody id="catalog-body"><tr><td colspan="5" style="text-align:center;">Đang tải...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/client.js"></script>
  <script>
    const readerId = requireLogin();
    if (readerId) { renderClientSidebar("catalog"); loadCatalog(); }

    const searchInput = document.getElementById("search-q");
    const clearBtn = document.getElementById("clear-catalog-btn");

    function updateClearBtn() {
      if (searchInput && clearBtn) {
        clearBtn.style.display = searchInput.value.trim().length > 0 ? "block" : "none";
      }
    }

    function clearCatalogSearch() {
      if (searchInput) {
        searchInput.value = "";
        searchInput.focus();
      }
      if (clearBtn) clearBtn.style.display = "none";
      loadCatalog();
    }

    if (searchInput) {
      searchInput.addEventListener("keydown", e => {
        if (e.key === "Enter") loadCatalog();
        else if (e.key === "Escape") clearCatalogSearch();
      });
      searchInput.addEventListener("input", () => {
        updateClearBtn();
        if (!searchInput.value.trim()) loadCatalog();
      });
      searchInput.addEventListener("search", () => {
        updateClearBtn();
        if (!searchInput.value.trim()) loadCatalog();
      });
    }

    async function loadCatalog() {
      const q = document.getElementById("search-q").value.trim();
      updateClearBtn();
      const tbody = document.getElementById("catalog-body");
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Đang tải...</td></tr>`;
      try {
        const books = await fetchAPI(q ? "/api/books?q=" + encodeURIComponent(q) : "/api/books");
        if (!books.length) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Không tìm thấy sách</td></tr>`;
          return;
        }
        const rows = await Promise.all(books.map(async (b) => {
          let available = 0, total = 0;
          try {
            const av = await fetchAPI("/api/books/availability?isbn=" + encodeURIComponent(b.isbn));
            available = av.availableCount; total = av.totalCopies;
          } catch (e) {}
          const action = available === 0
            ? `<button class="btn btn-primary btn-sm" onclick="reserveBook('${b.isbn}')">Đặt trước</button>`
            : `<span class="badge badge-success">Có sẵn</span>`;
          return `<tr><td>${b.isbn}</td><td>${b.title}</td><td>${b.author || "-"}</td><td><strong>${available}</strong>/${total}</td><td>${action}</td></tr>`;
        }));
        tbody.innerHTML = rows.join("");
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--danger);">Lỗi tải</td></tr>`;
      }
    }

    async function reserveBook(isbn) {
      if (!confirm("Đặt trước " + isbn + "?")) return;
      try {
        await fetchAPI("/api/reservations", {
          method: "POST",
          body: JSON.stringify({ readerId, isbn })
        });
        showToast("Đặt trước thành công", "success");
        loadCatalog();
      } catch (e) {}
    }
  </script>
</body>
</html>
