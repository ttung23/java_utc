<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad-staff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="skin-staff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg-grad-staff)" />
  
  <!-- Hair Back -->
  <path d="M26 40 C24 20 76 20 74 40 C74 58 70 65 70 65 C70 65 30 65 30 65 C30 65 26 58 26 40 Z" fill="#78350f" />
  
  <!-- Ears -->
  <circle cx="31" cy="48" r="5.5" fill="url(#skin-staff)" />
  <circle cx="69" cy="48" r="5.5" fill="url(#skin-staff)" />
  
  <!-- Face -->
  <ellipse cx="50" cy="48" rx="19" ry="21" fill="url(#skin-staff)" />
  
  <!-- Hair Front -->
  <path d="M30 38 C35 24 65 24 70 38 C62 30 52 32 50 36 C48 32 38 30 30 38 Z" fill="#92400e" />
  
  <!-- Eyes -->
  <ellipse cx="42" cy="46" rx="2.2" ry="2.8" fill="#1e293b" />
  <ellipse cx="58" cy="46" rx="2.2" ry="2.8" fill="#1e293b" />
  <circle cx="41.2" cy="45.2" r="0.8" fill="#ffffff" />
  <circle cx="57.2" cy="45.2" r="0.8" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M38 41 Q42 39 46 41" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />
  <path d="M54 41 Q58 39 62 41" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Nose -->
  <path d="M49 49 Q50 53 52 52" fill="none" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" />
  
  <!-- Cheeks blush -->
  <circle cx="37" cy="53" r="3.5" fill="#f43f5e" opacity="0.25" />
  <circle cx="63" cy="53" r="3.5" fill="#f43f5e" opacity="0.25" />
  
  <!-- Smile -->
  <path d="M44 57 Q50 63 56 57" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" />
  
  <!-- Neck -->
  <path d="M44 67 L44 75 L56 75 L56 67 Z" fill="url(#skin-staff)" />
  
  <!-- Clothes -->
  <path d="M22 100 C22 80 34 74 50 74 C66 74 78 80 78 100 Z" fill="#0f766e" />
  <path d="M42 75 L50 85 L58 75 Z" fill="#ffffff" />
  <!-- Badge ID on chest -->
  <rect x="33" y="85" width="10" height="12" rx="1.5" fill="#ffffff" />
  <rect x="35" y="87" width="6" height="5" fill="#3b82f6" />
  <line x1="35" y1="94" x2="41" y2="94" stroke="#94a3b8" stroke-width="1" />
</svg>

