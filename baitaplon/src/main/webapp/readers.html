<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SLMS - Quản Lý Độc Giả Thư Viện</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar"></aside>

  <main class="main-wrapper">
    <div class="top-header">
      <div>
        <h1 class="page-title">Quản Lý Độc Giả</h1>
        <p class="page-subtitle">Theo dõi hạn ngạch mượn sách, hạn thẻ thư viện và nợ phạt</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openAddReaderModal()">+ Thêm Độc Giả Mới</button>
      </div>
    </div>

    <!-- Bảng danh sách độc giả -->
    <div class="panel">
      <div class="panel-header" style="flex-wrap:wrap;gap:12px;">
        <h2 class="panel-title">Danh sách Độc giả</h2>
        <div style="position:relative;display:flex;align-items:center;width:280px;max-width:100%;">
          <input type="search" id="reader-search-input" placeholder="Tìm theo mã hoặc tên..." 
            oninput="handleReaderSearch()" 
            style="width:100%;padding:7px 32px 7px 12px;font-size:13px;border-radius:6px;border:1px solid var(--border);">
          <button id="reader-clear-search-btn" class="clear-search-btn" type="button" 
            onclick="clearReaderSearch()" title="Xóa tìm kiếm">✕</button>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Mã độc giả</th>
              <th>Họ và tên</th>
              <th>Loại độc giả</th>
              <th>Hạn thẻ</th>
              <th>Nợ phạt</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="readers-table-body">
            <tr><td colspan="7" style="text-align:center;">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="readers-pagination"></div>
    </div>

    <!-- Modal Thêm Độc Giả -->
    <div id="add-reader-modal" class="modal-overlay">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 id="reader-modal-title">Thêm Độc Giả Mới</h3>
          <button class="btn btn-secondary btn-sm" onclick="closeAddReaderModal()">✕</button>
        </div>
        <form onsubmit="submitAddReader(event)">
          <div class="form-group" style="margin-bottom:12px;">
            <label>Mã độc giả (Reader ID):</label>
            <input type="text" id="reader-id" required placeholder="VD: RD006">
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label>Họ và tên:</label>
            <input type="text" id="reader-name" required placeholder="Nhập tên độc giả">
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label>Loại độc giả:</label>
            <select id="reader-type">
              <option value="STUDENT">Sinh viên (STUDENT) - Tối đa 5 cuốn, 14 ngày</option>
              <option value="LECTURER">Giảng viên (LECTURER) - Tối đa 10 cuốn, 30 ngày</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:18px;">
            <label>Hạn thẻ thư viện:</label>
            <input type="date" id="reader-expiry" required value="2027-12-31">
          </div>
          <div class="form-group" style="margin-bottom:18px;">
            <label>Trạng thái tài khoản:</label>
            <select id="reader-status">
              <option value="ACTIVE">Đang hoạt động</option>
              <option value="BLOCKED">Đã khóa</option>
              <option value="EXPIRED">Hết hạn</option>
            </select>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeAddReaderModal()">Hủy</button>
            <button type="submit" class="btn btn-primary" id="reader-submit-button">Lưu Độc Giả</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    let readersById = {};
    let editingReaderId = null;
    let allReadersList = [];
    let filteredReadersList = [];
    let readersCurrentPage = 1;
    let readersPageSize = 10;

    function removeAccents(str) {
      return (str || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function formatReaderType(type) {
      switch ((type || "").toUpperCase()) {
        case "STUDENT":
          return "Sinh viên";
        case "LECTURER":
          return "Giảng viên";
        default:
          return type || "-";
      }
    }

    function formatReaderStatus(status) {
      switch ((status || "").toUpperCase()) {
        case "ACTIVE":
          return { text: "Đang hoạt động", badge: "badge-success" };
        case "BLOCKED":
          return { text: "Đã khóa", badge: "badge-danger" };
        case "EXPIRED":
          return { text: "Hết hạn", badge: "badge-warning" };
        default:
          return { text: status || "-", badge: "badge-secondary" };
      }
    }

    function handleReaderSearch() {
      const input = document.getElementById("reader-search-input");
      const clearBtn = document.getElementById("reader-clear-search-btn");
      const kw = (input ? input.value : "").trim();

      if (clearBtn) {
        clearBtn.style.display = kw ? "block" : "none";
      }

      readersCurrentPage = 1;
      applyReaderFilter();
    }

    function clearReaderSearch() {
      const input = document.getElementById("reader-search-input");
      const clearBtn = document.getElementById("reader-clear-search-btn");
      if (input) {
        input.value = "";
        input.focus();
      }
      if (clearBtn) clearBtn.style.display = "none";
      readersCurrentPage = 1;
      applyReaderFilter();
    }

    function applyReaderFilter() {
      const input = document.getElementById("reader-search-input");
      const kw = (input ? input.value : "").trim();
      const rawKw = kw.toLowerCase();
      const noAccKw = removeAccents(kw);

      if (!kw) {
        filteredReadersList = allReadersList;
      } else {
        filteredReadersList = allReadersList.filter(r => {
          const id = (r.readerId || "").toLowerCase();
          const name = (r.fullName || "").toLowerCase();
          const nameNoAcc = removeAccents(r.fullName);
          const type = (r.type || "").toLowerCase();
          const typeVi = formatReaderType(r.type).toLowerCase();
          const status = (r.status || "").toLowerCase();
          const statusVi = formatReaderStatus(r.status).text.toLowerCase();

          return id.includes(rawKw) ||
            name.includes(rawKw) ||
            nameNoAcc.includes(noAccKw) ||
            type.includes(rawKw) ||
            typeVi.includes(rawKw) ||
            status.includes(rawKw) ||
            statusVi.includes(rawKw);
        });
      }

      const tbody = document.getElementById("readers-table-body");
      if (filteredReadersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Không tìm thấy độc giả nào phù hợp</td></tr>`;
        renderPaginationControls({
          containerId: "readers-pagination",
          totalItems: 0,
          currentPage: 1,
          pageSize: readersPageSize,
          onPageChange: () => {}
        });
        return;
      }

      renderReadersTable();
    }

    function renderReadersTable() {
      const tbody = document.getElementById("readers-table-body");
      const pageReaders = paginateItems(filteredReadersList, readersCurrentPage, readersPageSize);

      tbody.innerHTML = pageReaders.map(r => {
        const st = formatReaderStatus(r.status);
        const typeText = formatReaderType(r.type);
        const fineStyle = r.balanceFine > 50000 ? "color:var(--danger);font-weight:700;" : "";

        return `
          <tr>
            <td><strong>${r.readerId}</strong></td>
            <td>${r.fullName}</td>
            <td><span class="badge badge-primary">${typeText}</span></td>
            <td>${r.expiryDate || "-"}</td>
            <td style="${fineStyle}">${formatCurrency(r.balanceFine)}</td>
            <td><span class="badge ${st.badge}">${st.text}</span></td>
            <td>
              <a href="loans.html" class="btn btn-secondary btn-sm">Mượn sách</a>
              <button class="btn btn-secondary btn-sm" onclick="editReader('${r.readerId}')">Sửa</button>
              <button class="btn btn-danger btn-sm" onclick="deleteReader('${r.readerId}')">Xóa</button>
            </td>
          </tr>
        `;
      }).join("");

      renderPaginationControls({
        containerId: "readers-pagination",
        totalItems: filteredReadersList.length,
        currentPage: readersCurrentPage,
        pageSize: readersPageSize,
        onPageChange: (newPage, newPageSize) => {
          readersCurrentPage = newPage;
          readersPageSize = newPageSize;
          renderReadersTable();
        }
      });
    }

    async function loadReaders() {
      const tbody = document.getElementById("readers-table-body");
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Đang tải...</td></tr>`;

      try {
        const readers = await fetchAPI("/api/readers");
        if (!readers || readers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Chưa có độc giả nào</td></tr>`;
          renderPaginationControls({
            containerId: "readers-pagination",
            totalItems: 0,
            currentPage: 1,
            pageSize: readersPageSize,
            onPageChange: () => {}
          });
          return;
        }

        readersById = Object.fromEntries(readers.map(reader => [reader.readerId, reader]));
        allReadersList = readers;
        applyReaderFilter();
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--danger);">Lỗi tải danh sách độc giả</td></tr>`;
      }
    }

    function openAddReaderModal() {
      editingReaderId = null;
      document.getElementById("reader-modal-title").textContent = "Thêm Độc Giả Mới";
      document.getElementById("reader-submit-button").textContent = "Lưu Độc Giả";
      document.getElementById("reader-id").readOnly = false;
      document.querySelector("#add-reader-modal form").reset();
      document.getElementById("reader-status").value = "ACTIVE";
      document.getElementById("add-reader-modal").classList.add("open");
    }

    function editReader(readerId) {
      const reader = readersById[readerId];
      if (!reader) return;
      editingReaderId = readerId;
      document.getElementById("reader-modal-title").textContent = "Cập Nhật Độc Giả";
      document.getElementById("reader-submit-button").textContent = "Lưu Thay Đổi";
      document.getElementById("reader-id").value = reader.readerId;
      document.getElementById("reader-id").readOnly = true;
      document.getElementById("reader-name").value = reader.fullName;
      document.getElementById("reader-type").value = reader.type;
      document.getElementById("reader-expiry").value = reader.expiryDate;
      document.getElementById("reader-status").value = reader.status;
      document.getElementById("add-reader-modal").classList.add("open");
    }

    function closeAddReaderModal() {
      document.getElementById("add-reader-modal").classList.remove("open");
    }

    async function submitAddReader(e) {
      e.preventDefault();
      const reader = {
        readerId: document.getElementById("reader-id").value.trim(),
        fullName: document.getElementById("reader-name").value.trim(),
        type: document.getElementById("reader-type").value,
        expiryDate: document.getElementById("reader-expiry").value,
        balanceFine: 0,
        status: document.getElementById("reader-status").value
      };

      try {
        await fetchAPI(editingReaderId
          ? `/api/readers/${encodeURIComponent(editingReaderId)}`
          : "/api/readers", {
          method: editingReaderId ? "PUT" : "POST",
          body: JSON.stringify(reader)
        });
        showToast(editingReaderId ? "Cập nhật độc giả thành công!" : "Thêm độc giả thành công!", "success");
        closeAddReaderModal();
        loadReaders();
      } catch (e) {}
    }

    async function deleteReader(readerId) {
      if (!confirm(`Xóa độc giả ${readerId}? Không thể xóa độc giả đã có lịch sử mượn.`)) return;
      try {
        await fetchAPI(`/api/readers/${encodeURIComponent(readerId)}`, { method: "DELETE" });
        showToast("Xóa độc giả thành công!", "success");
        loadReaders();
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar("readers");
      loadReaders();
    });
  </script>
</body>
</html>
